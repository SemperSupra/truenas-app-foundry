name: Validate TrueNAS source contract

on:
  pull_request:
    paths:
      - '.foundry/truenas-compatibility/**'
      - 'tools/validate_truenas_source_contract.py'
      - 'tools/prepare_truenas_platform_values.py'
      - 'tools/test_prepare_truenas_platform_values.py'
      - '.github/workflows/validate-truenas-source-contract.yml'
      - 'docs/catalog-materialization-parity.md'
      - 'docs/testing-strategy.md'
  push:
    branches: [main]
    paths:
      - '.foundry/truenas-compatibility/**'
      - 'tools/validate_truenas_source_contract.py'
      - 'tools/prepare_truenas_platform_values.py'
      - 'tools/test_prepare_truenas_platform_values.py'
      - '.github/workflows/validate-truenas-source-contract.yml'
      - 'docs/catalog-materialization-parity.md'
      - 'docs/testing-strategy.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truenas-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Pinned TrueNAS middleware materialization contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Foundry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve pinned middleware identity
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('.foundry/truenas-compatibility/25.04.2.6-materialization.json', encoding='utf-8'))
          print(f"repository={p['middleware']['repository']}")
          print(f"commit={p['middleware']['commit']}")
          PY

      - name: Checkout exact TrueNAS middleware source
        shell: bash
        env:
          MW_REPOSITORY: ${{ steps.profile.outputs.repository }}
          MW_COMMIT: ${{ steps.profile.outputs.commit }}
        run: |
          set -euo pipefail
          rm -rf .cache/truenas-middleware
          mkdir -p .cache/truenas-middleware
          git -C .cache/truenas-middleware init
          git -C .cache/truenas-middleware remote add origin "$MW_REPOSITORY"
          git -C .cache/truenas-middleware fetch --depth=1 origin "$MW_COMMIT"
          git -C .cache/truenas-middleware checkout --detach FETCH_HEAD
          test "$(git -C .cache/truenas-middleware rev-parse HEAD)" = "$MW_COMMIT"

      - name: Validate source-derived compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_truenas_source_contract.py \
            --source-root .cache/truenas-middleware \
            --evidence source-contract-evidence.json

      - name: Install platform-resolver test dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Test fail-closed platform value resolution
        shell: bash
        run: python3 tools/test_prepare_truenas_platform_values.py

      - name: Record public-safe compatibility evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### TrueNAS middleware materialization-contract gate'
            if [[ -f source-contract-evidence.json ]]; then
              echo '```json'
              cat source-contract-evidence.json
              echo '```'
            else
              echo 'No PASS evidence file was produced; inspect the failed validation step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
