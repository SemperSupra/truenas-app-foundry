name: Qualify WOW Go TrueNAS App

on:
  pull_request:
    paths:
      - 'candidates/wow-sidecar-go-app/**'
      - 'tools/validate_wow_sidecar_go_candidate.py'
      - 'tests/test_wow_sidecar_go_candidate.py'
      - '.github/workflows/qualify-wow-sidecar-go-app-prep.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned render-test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check             'Jinja2==3.1.6'             'PyYAML==6.0.3'
          python3 -m pip check

      - name: Enforce public-safe exact-image boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'SemperSupra/[A-Za-z0-9_.-]+-private|mark-e-deyoung/[A-Za-z0-9_.-]+-private'             candidates/wow-sidecar-go-app
          python3 - <<'PY'
          import json
          p='candidates/wow-sidecar-go-app/candidate.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['phase'] == 'exact-image-bound-public-render-pending'
          assert d['container']['synthetic_digest_fixture'] is False
          assert d['container']['publication_state'] == 'published-verified'
          assert d['gates']['runtime_independent_accepted'] is True
          assert d['gates']['registry_image_published'] is True
          assert d['gates']['public_app_render_qualified'] is False
          assert d['gates']['hil_eligible'] is False
          PY

      - name: Validate candidate and deterministic render contract
        run: |
          set -euo pipefail
          python3 tools/validate_wow_sidecar_go_candidate.py             --candidate candidates/wow-sidecar-go-app/candidate.json
          python3 -m unittest -v tests.test_wow_sidecar_go_candidate

      - name: Assert no deployment claim
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('candidates/wow-sidecar-go-app/candidate.json', encoding='utf-8'))
          assert d['container']['registry_reference'] == 'ghcr.io/sempersupra/wow-sidecar@sha256:2d248590ddad5a6c82b29ec0da8d851a3985b893273f16282c851b09a2b9188d'
          assert d['gates']['registry_image_published'] is True
          assert not any((
              d['gates']['public_app_render_qualified'],
              d['gates']['private_truenas_hil_qualified'],
              d['gates']['state_preserving_cutover_qualified'],
              d['gates']['hil_eligible'],
          ))
          print('EXACT-IMAGE / NO-DEPLOYMENT boundary PASS')
          PY

      - name: Pull exact published WOW image and permissions helper
        id: pull
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wow='ghcr.io/sempersupra/wow-sidecar@sha256:2d248590ddad5a6c82b29ec0da8d851a3985b893273f16282c851b09a2b9188d'
          helper='ixsystems/container-utils@sha256:46eba20714c1cc6784f60e245c32c33a2d9f616e47d804694a9854248c89a992'
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker pull "$wow"; then
            echo 'public_pull=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$wow"
            echo 'public_pull=false' >> "$GITHUB_OUTPUT"
          fi
          docker pull "$helper"

      - name: Qualify pinned official TrueNAS materializer render
        shell: bash
        env:
          PUBLIC_PULL: ${{ steps.pull.outputs.public_pull }}
        run: |
          set -euo pipefail
          sudo -n python3 tools/validate_wow_sidecar_go_app.py \
            --public-pull "$PUBLIC_PULL" \
            --evidence wow-sidecar-go-app-evidence.json

      - name: Record public-safe official render evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### WOW Go TrueNAS official render qualification'
            if [[ -f wow-sidecar-go-app-evidence.json ]]; then
              echo '~~~json'
              cat wow-sidecar-go-app-evidence.json
              echo '~~~'
            else
              echo 'No PASS evidence file was produced; inspect the failed qualification step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
