name: Public Foundry strict OCI image admission gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/package_truenas_deployment_artifact.py"
      - "tools/test_package_truenas_deployment_artifact.py"
      - ".github/workflows/public-immutable-artifact-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-immutable-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-artifact-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python stdlib offline artifact tests
        run: |
          git rev-parse HEAD
          python3 -m py_compile tools/package_truenas_deployment_artifact.py tools/test_package_truenas_deployment_artifact.py
          python3 -m unittest -v tools/test_package_truenas_deployment_artifact.py
