name: FolioRelay T6 Candidate Contract

on:
  pull_request:
    branches:
      - feat/version-aware-truenas-target-reconcile
    paths:
      - ".foundry/foliorelay/**"
      - ".foundry/truenas-compatibility/**"
      - "tools/build_foliorelay_t6_control.py"
      - "tools/test_build_foliorelay_t6_control.py"
      - ".github/workflows/validate-foliorelay-t6-candidate.yml"

permissions:
  contents: read

jobs:
  beta3-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Foundry source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Unit test FolioRelay exporter
        run: python3 -m unittest tools/test_build_foliorelay_t6_control.py

      - name: Build exact BETA.3 control bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/foliorelay-t6-beta3
          python3 tools/build_foliorelay_t6_control.py \
            --publication-receipt .foundry/foliorelay/t6/beta3/publication-receipt.json \
            --compose .foundry/foliorelay/t6/beta3/compose.json \
            --values .foundry/foliorelay/t6/beta3/values.yaml \
            --target-profile .foundry/truenas-compatibility/26.0.0-BETA.3-materialization.json \
            --output /tmp/foliorelay-t6-beta3 \
            --foundry-ref "${{ github.event.pull_request.head.sha }}"

      - name: Verify control receipt binds exact candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/foliorelay-t6-beta3")
          control = json.loads((root / "control.json").read_text())
          assert control["schema"] == "semper-supra.foliorelay-truenas-t6-control/1"
          assert control["candidate"]["truenas_version"] == "26.0.0-BETA.3"
          assert control["candidate"]["control_image"].endswith("sha256:0ffabcc1ced0325c41c54d860c6fe248e4fc8afeea3994dcebb999d6a14ee1ce")
          assert control["candidate"]["cups_image"].endswith("sha256:b644b4b1e064a1d10c18fbbb9f9aa09a2835e7e9a48ccda5a67d44cbda006b4f")
          required = set(control["required_oracles"])
          assert "control-cups-dnssd-uuid-coherence" in required
          assert "dnssd-universal-visible" in required
          assert "pdf-exact-source-inbox" in required
          assert "urf-exact-source-inbox" in required
          assert "delete-zero-residue" in required
          print(json.dumps({
              "status": "PASS",
              "schema": control["schema"],
              "foundry_ref": control["foundry_ref"],
              "truenas_version": control["candidate"]["truenas_version"],
              "control_image": control["candidate"]["control_image"],
              "cups_image": control["candidate"]["cups_image"],
              "compose_sha256": control["artifacts"]["compose_canonical_sha256"],
              "secrets_captured": control["secrets_captured"],
          }, sort_keys=True))
          PY

      - name: Upload exact BETA.3 control bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foliorelay-t6-beta3-control
          path: /tmp/foliorelay-t6-beta3
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
