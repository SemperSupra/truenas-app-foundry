name: Validate TrueNAS catalog render-install adapter

on:
  pull_request:
    paths:
      - "tools/patch_truenas_ci_for_exact_validator.py"
      - "tools/test_patch_truenas_ci_for_exact_validator.py"
      - "docs/truenas-catalog-render-install-v2.md"
      - ".github/workflows/validate-truenas-catalog-render-install-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise narrow upstream ci.py patch contract
        run: |
          python3 -m unittest -v tools/test_patch_truenas_ci_for_exact_validator.py
          python3 -m py_compile tools/patch_truenas_ci_for_exact_validator.py
