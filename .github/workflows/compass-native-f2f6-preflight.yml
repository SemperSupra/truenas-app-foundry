name: Foundry Model Compass native F2–F6 source and storage guards
on:
  pull_request:
    paths:
      - 'tests/consumers/model_compass/truenas_native_compass_f2f6.py'
      - 'tests/consumers/model_compass/truenas_native_guest_transport_probe.py'
      - 'tests/consumers/model_compass/native_guest_harness.patch'
      - 'tests/consumers/model_compass/native_zfs_retention.py'
      - 'tests/consumers/model_compass/test_native_compass_f2f6.py'
      - '.github/workflows/compass-native-f2f6-preflight.yml'
permissions:
  contents: read
concurrency:
  group: foundry-compass-native-f2f6-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce source-verbatim TrueNAS KVM + exact guest-only overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.rdte.test_foundry_vendored_truenas_t2
          python3 -m unittest discover -s tests/consumers/model_compass -p 'test_native_compass_f2f6.py' -v
          python3 -m unittest discover -s tests/consumers/model_compass -p 'test_native_zfs_retention.py' -v
          python3 -m unittest discover -s tests/consumers/model_compass -p 'test_native_guest_registry.py' -v
          python3 -m py_compile \
            tests/consumers/model_compass/truenas_native_compass_f2f6.py \
            tests/consumers/model_compass/truenas_native_guest_transport_probe.py
          python3 tests/consumers/model_compass/prepare_guest_harness.py \
            --out "$RUNNER_TEMP/compass-f2f6-overlay" \
            --receipt "$RUNNER_TEMP/compass-f2f6-overlay.json"
          p="$RUNNER_TEMP/compass-f2f6-overlay/tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh"
          bash -n "$p"
          grep -q -- '--full-lifecycle' "$p"
          grep -q '127.0.0.1:18098-:18088' "$p"
          python3 - "$RUNNER_TEMP/compass-f2f6-overlay.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          assert doc['classification']=='SOURCE_OVERLAY_ONLY'
          assert doc['real_guest_HIL']=='NOT_RUN'
          assert doc['upstream_modified'] is False
          assert doc['site_modified'] is False
          print('PASS: exact source-verbatim vendor, native F2-F6 only in copied harness')
          PY
