name: Qualify Foundry Catalog read-path integration
on:
  pull_request:
    paths:
      - 'tools/foundry_app_inventory.py'
      - 'tools/foundry_catalog_inventory_export.py'
      - 'tools/foundry_catalog_federation.py'
      - 'tools/test_foundry_catalog_inventory_export.py'
      - 'tests/test_foundry_catalog_federation.py'
      - 'tests/test_foundry_catalog_api_contract.py'
      - 'tests/test_foundry_catalog_readpath_integration.py'
      - '.foundry/bootstrap/foundry-rdte-probe.json'
      - 'schemas/foundry-catalog-read-api-v0.openapi.json'
      - '.github/workflows/qualify-foundry-catalog-readpath.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundry-catalog-readpath-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-readpath:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check read-only source and API modules compile
        run: python3 -m py_compile tools/foundry_app_inventory.py tools/foundry_catalog_inventory_export.py tools/foundry_catalog_federation.py
      - name: Run canonical inventory, federation, and integration tests
        run: |
          python3 -m unittest -v tools/test_foundry_app_inventory.py tools/test_foundry_catalog_inventory_export.py
          python3 -m unittest discover -s tests -p 'test_foundry_catalog*.py' -v
