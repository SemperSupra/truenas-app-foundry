name: Export immutable Minecraft 1.15.30 Paper T6 source control

on:
  workflow_call:
    inputs:
      foundry_ref:
        type: string
        required: true
      target_version:
        type: string
        required: true
  pull_request:
    paths:
      - 'tools/export_minecraft_paper_t6_control.py'
      - 'tests/test_export_minecraft_paper_11530_t6_control.py'
      - '.foundry/controls/minecraft-paper-11530-upstream.json'
      - '.github/workflows/export-minecraft-paper-11530-t6-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-v11530-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve exact candidate source identity
        id: candidate
        env:
          FOUND_REF: ${{ inputs.foundry_ref }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          ref="${FOUND_REF:-$GITHUB_SHA}"
          test "${TARGET_VERSION:-25.04.1}" = 25.04.1
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/truenas-app-foundry
          ref: ${{ steps.candidate.outputs.ref }}
          persist-credentials: false
      - name: Confirm exact immutable candidate checkout
        run: test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.ref }}"
      - name: Qualify historical and new source-only control contracts
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_export_minecraft_paper_t6_control.py
          python3 -m unittest -v tests/test_export_minecraft_paper_11530_t6_control.py
          python3 tools/qualify_minecraft_catalog_11530_delta.py > "$RUNNER_TEMP/upstream-delta.json"
      - name: Qualify new immutable native app source and external world render
        run: |
          set -euo pipefail
          python3 tools/validate_minecraft_world_control.py --catalog-profile 1.15.30 \
            > "$RUNNER_TEMP/11530-render-summary.json"
      - name: Export version-bound signed-by-digest source-only control
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/minecraft-11530-control"
          exact="$(git rev-parse HEAD)"
          python3 tools/export_minecraft_paper_t6_control.py \
            --foundry-ref "$exact" \
            --catalog-version 1.15.30 \
            --target-version 25.04.1 \
            --source-evidence minecraft-world-control-evidence.json \
            --output "$RUNNER_TEMP/minecraft-11530-control" \
            > "$RUNNER_TEMP/11530-export-summary.json"
          python3 - "$RUNNER_TEMP/minecraft-11530-control/control.json" "$exact" <<'PY'
          import hashlib,json,sys
          c=json.load(open(sys.argv[1]))
          head=sys.argv[2]
          assert c["foundry_ref"]==head
          assert c["runtime"]["catalog_version_candidate"]=="1.15.30"
          assert c["runtime"]["paper_version"]=="1.21.11"
          assert c["source"]["apps_commit"]=="559b9fe85212c800bc6770f152a65211df137a44"
          assert c["source"]["image_reference"]==("ghcr.io/itzg/minecraft-server:"
            "2026.10.0-java21@sha256:d4057e7019e9b19f25e039d4a204cc502e1a112d1a2305966a534f3d7079e644")
          assert not c["evidence"]["live_catalog_version_verified"]
          assert not c["evidence"]["live_minecraft_server_qualified"]
          assert not c["evidence"]["physical_truenas_qualified"]
          sign=c.copy()
          signature=sign.pop("control_sha256")
          observed=hashlib.sha256(json.dumps(sign,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert signature==observed
          PY
      - name: Upload immutable source-only candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minecraft-paper-11530-truenas-t6-candidate
          path: ${{ runner.temp }}/minecraft-11530-control/
          if-no-files-found: error
          retention-days: 7
      - name: Exact claims
        run: |
          echo 'SOURCE_CANDIDATE only. No TrueNAS guest, native App 1.15.30 container, Java protocol 774, CloudNet adopter or physical TrueNAS qualified.' >> "$GITHUB_STEP_SUMMARY"
