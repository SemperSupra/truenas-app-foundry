name: ArtCraft WebUI candidate cloud RDTE

on:
  pull_request:
    paths:
      - '.github/workflows/artcraft-webui-candidate.yml'
      - 'tools/artcraft-browser-probe.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artcraft-webui-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-browser:
    name: ArtCraft WASM static browser candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pull and run isolated upstream WebAssembly image
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/sbuchweitz/artcraft-in-a-box:latest
          mkdir -p evidence
          docker image inspect ghcr.io/sbuchweitz/artcraft-in-a-box:latest --format '{{json .RepoDigests}}' > evidence/wasm-image-digests.json
          docker run -d --name craft-wasm-rdte --read-only --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:18080:8080 ghcr.io/sbuchweitz/artcraft-in-a-box:latest
          for i in {1..60}; do if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi; sleep 2; done
          curl --fail --show-error --silent http://127.0.0.1:18080/healthz
          curl --fail --show-error --silent http://127.0.0.1:18080/versions.json > evidence/wasm-versions.json
          curl --fail --show-error --silent http://127.0.0.1:18080/photocraft/ > evidence/photocraft-index.html
          test -s evidence/photocraft-index.html
      - name: Inspect Web UI using Chrome on desktop and mobile viewports
        run: |
          set -euo pipefail
          npm install --no-save --prefix /tmp/craft-playwright playwright@1.56.1
          PLAYWRIGHT_PACKAGE=/tmp/craft-playwright/node_modules/playwright ARTCRAFT_PROBE_URL=http://127.0.0.1:18080/photocraft/ ARTCRAFT_PROBE_NAME=wasm-photocraft ARTCRAFT_EVIDENCE_DIR=evidence node tools/artcraft-browser-probe.cjs
      - name: Publish public-safe CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artcraft-wasm-public-rdte
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker rm -f craft-wasm-rdte || true

  streamed-desktop:
    name: LinuxServer Craft Apps streamed desktop candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pull and run isolated upstream desktop image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker pull lscr.io/linuxserver/craft-apps:v0.21.0-ls16
          docker image inspect lscr.io/linuxserver/craft-apps:v0.21.0-ls16 --format '{{json .RepoDigests}}' > evidence/streamed-image-digests.json
          docker run -d --name craft-stream-rdte --shm-size=1g --publish 127.0.0.1:13001:3001 lscr.io/linuxserver/craft-apps:v0.21.0-ls16
          for i in {1..90}; do if curl -k --fail --silent https://127.0.0.1:13001/ >/dev/null; then break; fi; sleep 2; done
          curl --insecure --fail --show-error --silent -I https://127.0.0.1:13001/ > evidence/streamed-headers.txt
      - name: Inspect desktop using Chrome on desktop and mobile viewports
        run: |
          set -euo pipefail
          npm install --no-save --prefix /tmp/craft-playwright playwright@1.56.1
          PLAYWRIGHT_PACKAGE=/tmp/craft-playwright/node_modules/playwright ARTCRAFT_PROBE_URL=https://127.0.0.1:13001/ ARTCRAFT_PROBE_NAME=streamed-desktop ARTCRAFT_EVIDENCE_DIR=evidence node tools/artcraft-browser-probe.cjs
      - name: Publish public-safe CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artcraft-streamed-public-rdte
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker rm -f craft-stream-rdte || true
