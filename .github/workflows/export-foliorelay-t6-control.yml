name: Export FolioRelay TrueNAS T6 control

on:
  workflow_call:
    inputs:
      foundry_ref:
        description: Exact SemperSupra/truenas-app-foundry commit to export
        required: true
        type: string
      target_version:
        description: Exact admitted TrueNAS version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      foundry_ref:
        description: Exact Foundry commit; blank uses this workflow commit
        required: false
        type: string
      target_version:
        description: Exact admitted TrueNAS version
        required: false
        default: 26.0.0-BETA.3
        type: string

permissions:
  contents: read

concurrency:
  group: foliorelay-t6-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact Foundry source
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.foundry_ref }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_REF:-}"
          if [[ -z "$ref" ]]; then ref="$GITHUB_SHA"; fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve exact target
        id: target
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-26.0.0-BETA.3}"
          case "$version" in
            25.04.1|25.04.2.6|25.10.7|26.0.0-BETA.3) ;;
            *) echo "unsupported FolioRelay TrueNAS target: $version" >&2; exit 2 ;;
          esac
          profile=".foundry/truenas-compatibility/${version}-materialization.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Foundry source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SemperSupra/truenas-app-foundry
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Validate exporter contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ steps.source.outputs.ref }}" ]]
          python3 -m unittest -v tools/test_build_foliorelay_t6_control.py
          python3 -m py_compile tools/build_foliorelay_t6_control.py

      - name: Build exact FolioRelay control bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/foliorelay-t6-control
          python3 tools/build_foliorelay_t6_control.py \
            --publication-receipt .foundry/foliorelay/t6/beta3/publication-receipt.json \
            --compose .foundry/foliorelay/t6/beta3/compose.json \
            --values .foundry/foliorelay/t6/beta3/values.yaml \
            --target-profile "${{ steps.target.outputs.profile }}" \
            --output /tmp/foliorelay-t6-control \
            --foundry-ref "${{ steps.source.outputs.ref }}" \
            | tee /tmp/foliorelay-t6-export.json

          publication=.foundry/foliorelay/t6/beta3/publication-receipt.json
          jq -e '
            .schema == "semper-supra.foliorelay-rdte-publication/1" and
            .status == "PASS" and
            .control.anonymous_pull == true and
            .cups.anonymous_pull == true and
            .control.signed_keyless == true and
            .cups.signed_keyless == true
          ' "$publication" >/dev/null
          expected_control="$(jq -r '.control.image + "@" + .control.digest' "$publication")"
          expected_cups="$(jq -r '.cups.image + "@" + .cups.digest' "$publication")"

          jq -e \
            --arg foundry_ref "${{ steps.source.outputs.ref }}" \
            --arg version "${{ steps.target.outputs.version }}" \
            --arg control "$expected_control" \
            --arg cups "$expected_cups" '
            .schema == "semper-supra.foliorelay-truenas-t6-control/1" and
            .foundry_ref == $foundry_ref and
            .candidate.truenas_version == $version and
            .candidate.control_image == $control and
            .candidate.cups_image == $cups and
            .secrets_captured == false
          ' /tmp/foliorelay-t6-control/control.json >/dev/null

          test -s /tmp/foliorelay-t6-control/compose.json
          test -s /tmp/foliorelay-t6-control/publication-receipt.json
          ! grep -R -E -q 'BEGIN .*PRIVATE KEY|ghp_|github_pat_' /tmp/foliorelay-t6-control

      - name: Upload exact FolioRelay T6 control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foliorelay-t6-control
          path: /tmp/foliorelay-t6-control/
          if-no-files-found: error
          retention-days: 7

      - name: Record public-safe export evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### FolioRelay TrueNAS T6 control export"
            echo
            echo "Foundry source: ${{ steps.source.outputs.ref }}"
            echo "TrueNAS target: ${{ steps.target.outputs.version }}"
            if [[ -f /tmp/foliorelay-t6-control/control.json ]]; then
              echo "Control image: $(jq -r '.candidate.control_image' /tmp/foliorelay-t6-control/control.json)"
              echo "CUPS image: $(jq -r '.candidate.cups_image' /tmp/foliorelay-t6-control/control.json)"
              echo "Compose identity: $(jq -r '.artifacts.compose_canonical_sha256' /tmp/foliorelay-t6-control/control.json)"
              echo "Secret values captured: $(jq -r '.secrets_captured' /tmp/foliorelay-t6-control/control.json)"
            else
              echo "Control bundle: not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
