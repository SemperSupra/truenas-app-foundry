name: xyOps native special-job plugin isolation cloud RDTE

on:
  pull_request:
    paths:
      - ".github/workflows/xyops-native-special-job-rdte.yml"
      - "tools/xyops-special-job-probe.go"
      - "tools/xyops-special-job-probe_test.go"
      - "tools/xyops-native-special-job-cloud-probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xyops-special-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  special-plugin:
    name: Native special event and ordinary xyOps event coexistence
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Qualify and build static Go xyOps event plugin reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/xyops-rdte-runtime
          GO111MODULE=off go test -v tools/xyops-special-job-probe.go tools/xyops-special-job-probe_test.go 2>&1 | tee evidence/xyops-native-go-tests.txt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o evidence/xyops-rdte-runtime/xyops-special-job-probe tools/xyops-special-job-probe.go
          chmod 755 evidence/xyops-rdte-runtime/xyops-special-job-probe
          cat > evidence/xyops-rdte-runtime/policy.json <<'JSON'
          {"allowed":[{"authority_ref":"https://github.com/example/synthetic-workset/issues/42","authority_revision":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","delegation":"synthetic-observe"}]}
          JSON
          chmod 644 evidence/xyops-rdte-runtime/policy.json
          sha256sum evidence/xyops-rdte-runtime/xyops-special-job-probe > evidence/xyops-special-plugin-sha256.txt
      - name: Launch disposable xyOps v1.1.15 conductor + local xySat
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/pixlcore/xyops@sha256:43661e5257b26cd0cc680c3588ff8432d9e5e92dc3cd50a345529d3f260721e1
          docker network create xyops-special-net
          docker volume create xyops-special-data
          docker run -d --init --name xyops-special --hostname xyops-special \
            --network xyops-special-net --memory 2500m --cpus 2 \
            --publish 127.0.0.1:15522:5522 \
            --volume xyops-special-data:/opt/xyops/data \
            --mount type=bind,source="$PWD/evidence/xyops-rdte-runtime",target=/opt/xyops-rdte,readonly \
            -e XYOPS_masters=xyops-special -e XYOPS_xysat_local=true \
            -e XYOPS_RDTE_POLICY=/opt/xyops-rdte/policy.json -e TZ=UTC \
            ghcr.io/pixlcore/xyops@sha256:43661e5257b26cd0cc680c3588ff8432d9e5e92dc3cd50a345529d3f260721e1
          ready=0
          for i in {1..60}; do
            if curl --silent --fail http://127.0.0.1:15522/api/app/ping > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
      - name: Exercise normal and special native xyOps Event Plugin jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/xyops-native-special-job-cloud-probe.py
      - name: Preserve sanitized evidence and resource usage
        if: always()
        shell: bash
        run: |
          docker ps --format '{{.Names}} {{.Status}}' > evidence/xyops-special-containers.txt || true
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' > evidence/xyops-special-resources.txt || true
      - name: Upload sanitized public CI receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xyops-native-special-job-cloud-rdte
          path: |
            evidence/xyops-native-special-job.json
            evidence/xyops-native-go-tests.txt
            evidence/xyops-special-plugin-sha256.txt
            evidence/xyops-special-resources.txt
            evidence/xyops-special-containers.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Destroy all disposable runtime state
        if: always()
        shell: bash
        run: |
          docker rm -f xyops-special 2>/dev/null || true
          docker volume rm xyops-special-data 2>/dev/null || true
          docker network rm xyops-special-net 2>/dev/null || true
