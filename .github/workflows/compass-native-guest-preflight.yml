name: TrueNAS Model Compass native guest transport source preflight
on:
  pull_request:
    paths:
      - 'tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh'
      - 'tools/rdte/vendor/truenas-kvm/scripts/truenas_middleware_compass_guest_transport_probe.py'
      - 'tools/rdte/requests/compass-native-guest/**'
      - '.github/workflows/compass-native-guest-preflight.yml'
permissions:
  contents: read
concurrency:
  group: compass-native-guest-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact-source Python and shell parser without a guest
        shell: bash
        run: |
          set -euo pipefail
          p='tools/rdte/vendor/truenas-kvm/scripts'
          # The canonical harness must remain byte-for-byte source-verbatim.
          python3 -m unittest -v tools.rdte.test_foundry_vendored_truenas_t2
          bash -n "$p/gha_kvm_truenas_rdte.sh"
          python3 -m py_compile tests/consumers/model_compass/truenas_native_guest_transport_probe.py
          python3 -m unittest discover -s tests/consumers/model_compass -p 'test_native_guest_registry.py' -v
          python3 tests/consumers/model_compass/prepare_guest_harness.py \
            --out "$RUNNER_TEMP/compass-native-guest-overlay" \
            --receipt "$RUNNER_TEMP/compass-native-guest-overlay-receipt.json"
          bash "$RUNNER_TEMP/compass-native-guest-overlay/tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh" --help | grep -q 'model-compass'
          python3 - <<'PY'
          from pathlib import Path
          original=Path('tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh').read_text()
          generated=Path(__import__('os').environ['RUNNER_TEMP'])/'compass-native-guest-overlay/tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh'
          s=generated.read_text()
          p=Path('tests/consumers/model_compass/truenas_native_guest_transport_probe.py').read_text()
          required=['model-compass', 'COMPASS_HOSTFWD', 'truenas_middleware_compass_guest_transport_probe.py', 'native_compass_image_transport_exercised', 'guest-image-transport']
          assert all(x in s for x in required)
          assert 'model-compass' not in original
          assert 'app.image.pull' in p and 'app.create' in p and 'app.delete' in p
          assert 'docker_daemon_modified' in p
          print('PASS: exact vendored source + disposable bounded native transport overlay')
          PY
      - name: Reject source path drifting from scoped native guest T6 contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/consumers/model_compass/native_guest_registry.py
          test -f tools/rdte/vendor/truenas-kvm/config/truenas-rdte-targets.json
          bash "$RUNNER_TEMP/compass-native-guest-overlay/tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh" --help | grep -q model-compass
