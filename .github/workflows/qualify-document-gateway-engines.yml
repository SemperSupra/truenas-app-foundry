name: Qualify Document Gateway Engines
run-name: Document Gateway engines ${{ github.sha }}

on:
  pull_request:
    paths:
      - 'candidates/document-gateway-app/**'
      - 'tools/materialize_document_gateway_conformance_target.py'
      - 'tools/validate_document_gateway_app.py'
      - '.github/workflows/qualify-document-gateway-engines.yml'
  push:
    branches: [main]
    paths:
      - 'candidates/document-gateway-app/**'
      - 'tools/materialize_document_gateway_conformance_target.py'
      - 'tools/validate_document_gateway_app.py'
      - '.github/workflows/qualify-document-gateway-engines.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-gateway-engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Compose runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cups-client cups-ipp-utils curl
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Materialize portable runtime contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/document-gateway-engine
          python3 tools/materialize_document_gateway_conformance_target.py \
            --profile published_ipp \
            --prepare-state \
            --output /tmp/document-gateway-engine/compose.json \
            --evidence /tmp/document-gateway-engine/docker-materialization.json

      - name: Exercise Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE=/tmp/document-gateway-engine/compose.json
          docker compose -p document-gateway-engine -f "${COMPOSE}" up -d
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:30880/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:30880/health
          ipptool -tv ipp://127.0.0.1:30631/ipp/print/Save_to_Documents \
            "$(find /usr/share/cups -type f -name get-printer-attributes.test -print -quit)"
          docker compose -p document-gateway-engine -f "${COMPOSE}" ps

      - name: Cleanup Docker Compose
        if: always()
        shell: bash
        run: |
          docker compose -p document-gateway-engine \
            -f /tmp/document-gateway-engine/compose.json down -v --remove-orphans || true

  podman:
    name: Podman Compose runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Podman and qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cups-client cups-ipp-utils curl podman podman-compose
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          podman version
          podman info

      - name: Materialize identical runtime contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/document-gateway-engine
          python3 tools/materialize_document_gateway_conformance_target.py \
            --profile published_ipp \
            --prepare-state \
            --output /tmp/document-gateway-engine/compose.json \
            --evidence /tmp/document-gateway-engine/podman-materialization.json

      - name: Exercise Podman Compose
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE=/tmp/document-gateway-engine/compose.json
          podman compose -p document-gateway-engine -f "${COMPOSE}" up -d
          for n in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:30880/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:30880/health
          ipptool -tv ipp://127.0.0.1:30631/ipp/print/Save_to_Documents \
            "$(find /usr/share/cups -type f -name get-printer-attributes.test -print -quit)"
          podman ps --format json > /tmp/document-gateway-engine/podman-ps.json

      - name: Publish Podman diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '### Podman Compose qualification'
            if [[ -f /tmp/document-gateway-engine/podman-ps.json ]]; then
              echo '~~~json'
              cat /tmp/document-gateway-engine/podman-ps.json
              echo '~~~'
            else
              echo 'No terminal podman ps evidence was produced.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup Podman Compose
        if: always()
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
        shell: bash
        run: |
          podman compose -p document-gateway-engine \
            -f /tmp/document-gateway-engine/compose.json down -v || true
