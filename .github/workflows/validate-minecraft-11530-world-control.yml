name: Validate isolated Minecraft 1.15.30 source-render candidate

on:
  pull_request:
    paths:
      - '.foundry/controls/minecraft-paper-11530-upstream.json'
      - '.foundry/controls/minecraft-paper-world-hostpath-values.yaml'
      - 'tools/validate_minecraft_world_control.py'
      - '.github/workflows/validate-minecraft-11530-world-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compare exact upstream 1.15.29 to 1.15.30 templates
        run: |
          set -euo pipefail
          python3 tools/qualify_minecraft_catalog_11530_delta.py > "$RUNNER_TEMP/11530-source-delta.json"
      - name: Qualify native 1.15.30 Compose render and independent world bind
        run: |
          set -euo pipefail
          python3 tools/validate_minecraft_world_control.py --catalog-profile 1.15.30 \
            > "$RUNNER_TEMP/11530-world-source-render.log"
          python3 - <<'PY'
          import json
          r=json.load(open("minecraft-world-control-evidence.json"))
          assert r["result"]=="PASS"
          assert r["server"]["catalog_version"]=="1.15.30"
          assert r["upstream"]["ref"]=="559b9fe85212c800bc6770f152a65211df137a44"
          assert r["server"]["image_ref"]==(
            "ghcr.io/itzg/minecraft-server:2026.10.0-java21@sha256:"
            "d4057e7019e9b19f25e039d4a204cc502e1a112d1a2305966a534f3d7079e644")
          assert "no live TrueNAS qualification" in r["non_claims"]
          PY
      - name: Publish bounded source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minecraft-paper-11530-source-render
          path: minecraft-world-control-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Declare exact non-claims
        run: |
          echo 'SOURCE_RENDER_ONLY: new Minecraft App version/image candidate, no guest proof, no Paper protocol pass, no read-only COLLAGE result or physical TrueNAS mutation.' >> "$GITHUB_STEP_SUMMARY"
