name: qualify WOW Sidecar TrueNAS source candidate

on:
  pull_request:
    paths:
      - 'candidates/wow-sidecar-app/**'
      - 'tools/validate_wow_sidecar_candidate.py'
      - 'tests/test_wow_sidecar_candidate.py'
      - '.github/workflows/qualify-wow-sidecar-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate candidate state machine
        run: |
          python3 tools/validate_wow_sidecar_candidate.py             --candidate candidates/wow-sidecar-app/candidate.json
          python3 -m unittest -v tests.test_wow_sidecar_candidate
      - name: Verify published WOW source and qualification-head equivalence
        shell: bash
        run: |
          set -euo pipefail
          published='c68f4250db460d485eb133b763003d3762f7617e'
          qualified='569142103e8e822a00178104b257e27b6e334638'
          repo='https://github.com/SemperSupra/wow-sidecar.git'
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin "$repo"
          git -C "$tmp" fetch -q --depth=1 origin "$published"
          test "$(git -C "$tmp" rev-parse FETCH_HEAD)" = "$published"
          git -C "$tmp" fetch -q --depth=1 origin "$qualified"
          for path in             Dockerfile             .github/workflows/container-candidate.yml             docs/container-source-contract.md             src/wow_sidecar/container_contract.py             tests/test_container_contract.py
          do
            git -C "$tmp" show "$published:$path" > "$tmp/published"
            git -C "$tmp" show "$qualified:$path" > "$tmp/qualified"
            cmp -s "$tmp/published" "$tmp/qualified"
          done
