name: TrueNAS Foundry Model Compass Exact-Source F0-F1 Rehearsal

on:
  pull_request:
    paths:
      - 'tests/consumers/model_compass/**'
      - '.github/workflows/consumer-model-compass.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-compass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-materialization:
    name: public F0-F1 Custom App normalized Compose/artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact proposed Foundry source, no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source identity and generic materialization rehearsal
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/consumers/model_compass/qualify.py
      - name: Fail closed on branch/floating source identity
        shell: bash
        run: |
          set -euo pipefail
          if python3 tests/consumers/model_compass/qualify.py --product-sha main >/dev/null 2>&1; then
            echo 'ERROR: accepted floating product source'
            exit 1
          fi
      - name: Reject unsafe guest registry staging plans before heavyweight HIL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/consumers/model_compass -p 'test_native_guest_registry.py' -v
          python3 tests/consumers/model_compass/native_guest_registry.py > "$RUNNER_TEMP/model-compass-guest-plan.json"
          python3 - "$RUNNER_TEMP/model-compass-guest-plan.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          assert doc["classification"]=="CANDIDATE_NOT_HIL"
          assert doc["image_published_external"] is False
          assert doc["native_F2_F6"]=="NOT_RUN"
          print("PASS: deterministic bounded guest registry rendezvous candidate (not installed)")
          PY

  registry-shape-runtime:
    name: public read-only registry fixture + pinned real OCI push/pull
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact Foundry source; persist no credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and prove guest-shape runner-local immutable OCI rendezvous
        shell: bash
        run: |
          set -euo pipefail
          bash tests/consumers/model_compass/verify_registry_runtime.sh
