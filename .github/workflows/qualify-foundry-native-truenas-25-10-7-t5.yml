name: Foundry exact 25.10.7 native T5 Apps lifecycle (no AD)
on:
  pull_request:
    paths:
      - '.github/workflows/qualify-foundry-native-truenas-25-10-7-t5.yml'
      - 'tools/rdte/requests/native-t5-25-10-7/*.json'

permissions:
  contents: read

concurrency:
  group: foundry-native-truenas-heavyweight
  cancel-in-progress: false

jobs:
  native-25-10-7-t5:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact one-use T5 request and independent accepted T3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tools/rdte/test_foundry_vendored_truenas_t2.py tools/rdte/test_foundry_native_truenas_apps_source.py tools/rdte/test_foundry_t5_request.py tools/rdte/test_foundry_t5_request_25107.py tools/rdte/test_github_t3_evidence.py
          mapfile -t requests < <(find tools/rdte/requests/native-t5-25-10-7 -maxdepth 1 -type f -name '*.json' -print | sort)
          (("${#requests[@]}" == 1)) || { echo 'exactly one version-specific T5 request required'; exit 2; }
          python3 tools/rdte/foundry_t5_request.py --request "${requests[0]}"
          python3 - "${requests[0]}" <<'PY'
          import json,sys
          from tools.rdte.github_t3_evidence import verify
          req=json.load(open(sys.argv[1],encoding="utf-8"))
          assert req["version"]=="25.10.7" and req["rung"]=="t5"
          assert verify(req) is True
          print("NATIVE_25_10_7_T3_PUBLIC_RUN_ARTIFACT_BOUND")
          PY
          test -c /dev/kvm
          bash -n tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh
      - name: Install disposable QEMU tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
      - name: Verify exact TrueNAS 25.10.7 native Apps lifecycle T4 and T5
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/foundry-native-25-10-7-t5-state"
          out="$RUNNER_TEMP/foundry-native-25-10-7-t5-receipt.json"
          bash tools/rdte/vendor/truenas-kvm/scripts/gha_kvm_truenas_rdte.sh \
            --target-version 25.10.7 --rung t5 --out "$out" --state-dir "$state"
          python3 - "$out" "$state" <<'PY'
          import json,pathlib,sys
          r=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert r["contract"]=="gha-kvm-system-lab/v1"
          assert r["target"]["version"]=="25.10.7" and r["target"]["rung"]=="T5"
          assert r["classification"]=="SUPPORTED" and r["oracleSatisfied"] is True
          o=r["oracles"]
          for key in ("vendor_iso_digest","installer_rpc_readonly","installer_install_completed",
                      "installed_middleware_authenticated","data_pool_created",
                      "apps_runtime_exercised","app_lifecycle_exercised"):
              assert o[key] is True,key
          assert o["foundry_materialization_exercised"] is False
          assert not pathlib.Path(sys.argv[2]).exists(), "disposable KVM guest residue"
          print("FOUNDRY_25_10_7_NATIVE_APPS_T5_ACCEPTED_ONLY")
          print("AGENT_DISPATCH_PRODUCT_F0_F5_NOT_TESTED")
          PY
      - name: Save terminal or fail-classified public receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-native-25-10-7-platform-t5
          path: ${{ runner.temp }}/foundry-native-25-10-7-t5-receipt.json
          if-no-files-found: warn
          retention-days: 7
