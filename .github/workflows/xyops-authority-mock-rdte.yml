name: xyOps timing-only authority model cloud qualification

on:
  pull_request:
    paths:
      - ".github/workflows/xyops-authority-mock-rdte.yml"
      - "tools/xyops-wake-contract-oracle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-model:
    name: Synthetic xyOps / Agent Dispatch wake authority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run stdlib-only adversarial reference oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          PYTHONDONTWRITEBYTECODE=1 TZ=UTC python3 tools/xyops-wake-contract-oracle.py 2>&1 | tee evidence/xyops-authority-oracle.txt
      - name: Retain public-safe offline results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xyops-wake-authority-reference-oracle
          path: evidence/xyops-authority-oracle.txt
          if-no-files-found: warn
          retention-days: 7
