name: FolioRelay Site Deployment Packaging

on:
  pull_request:
    paths:
      - "tools/package_foliorelay_site_deployment.py"
      - "tools/test_package_foliorelay_site_deployment.py"
      - "tools/package_truenas_deployment_artifact.py"
      - "tools/test_package_truenas_deployment_artifact.py"
      - ".github/workflows/foliorelay-site-deployment.yml"
  push:
    paths:
      - "tools/package_foliorelay_site_deployment.py"
      - "tools/test_package_foliorelay_site_deployment.py"
      - "tools/package_truenas_deployment_artifact.py"
      - "tools/test_package_truenas_deployment_artifact.py"
      - ".github/workflows/foliorelay-site-deployment.yml"

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile packaging tools
        run: |
          python -m py_compile tools/package_truenas_deployment_artifact.py
          python -m py_compile tools/package_foliorelay_site_deployment.py
      - name: Qualify generic deployment artifact
        run: python tools/test_package_truenas_deployment_artifact.py
      - name: Qualify FolioRelay site binding
        run: python -m unittest -v tools/test_package_foliorelay_site_deployment.py
