name: Qualify TrueNAS catalog render-install V2

on:
  pull_request:
    paths:
      - ".foundry/truenas-catalog-toolchain.json"
      - "tools/patch_truenas_ci_for_exact_validator.py"
      - "tools/test_patch_truenas_ci_for_exact_validator.py"
      - "docs/truenas-catalog-render-install-v2.md"
      - ".github/workflows/qualify-truenas-catalog-render-install-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-render-install-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate exact adapter contract
        run: |
          python3 -m unittest -v tools/test_patch_truenas_ci_for_exact_validator.py
          python3 -m py_compile tools/patch_truenas_ci_for_exact_validator.py

      - name: Exercise exact TrueNAS render-install lifecycle
        shell: bash
        run: |
          set -euo pipefail
          contract=".foundry/truenas-catalog-toolchain.json"
          apps_repo="$(jq -r '.apps.repository' "$contract")"
          apps_ref="$(jq -r '.apps.ref' "$contract")"
          validator_repo="$(jq -r '.apps_validation.repository' "$contract")"
          validator_ref="$(jq -r '.apps_validation.ref' "$contract")"
          declared_base="$(jq -r '.apps_validation.declared_base' "$contract")"
          base_digest="$(jq -r '.apps_validation.admitted_base_digest' "$contract")"

          root="$(mktemp -d)"
          # The pinned TrueNAS validator container writes rendered files as root.
          # Cleanup is post-oracle only; use runner sudo so a successful native
          # render/install rep is not converted into a false harness failure.
          trap 'sudo rm -rf -- "$root"' EXIT

          fetch_exact() {
            local repo="$1" ref="$2" dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "$repo"
            git -C "$dest" fetch -q --depth=1 origin "$ref"
            test "$(git -C "$dest" rev-parse FETCH_HEAD)" = "$ref"
            git -C "$dest" checkout -q --detach FETCH_HEAD
          }

          fetch_exact "$apps_repo" "$apps_ref" "$root/apps"
          fetch_exact "$validator_repo" "$validator_ref" "$root/apps_validation"
          grep -Fxq "FROM $declared_base" "$root/apps_validation/Dockerfile"

          test -n "$base_digest"
          docker pull --quiet "$base_digest" >/dev/null

          python3 - "$root/apps_validation/Dockerfile" "$declared_base" "$base_digest" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          old = "FROM " + sys.argv[2]
          new = "FROM " + sys.argv[3]
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("validator Dockerfile base contract drift")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          image="foundry/apps-validation:${validator_ref:0:12}"
          docker build --quiet -t "$image" "$root/apps_validation" >/dev/null
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          test -n "$image_id"

          original_ci_sha="$(sha256sum "$root/apps/.github/scripts/ci.py" | awk '{print $1}')"
          python3 tools/patch_truenas_ci_for_exact_validator.py \
            --input "$root/apps/.github/scripts/ci.py" \
            --output "$root/apps/.github/scripts/ci.py.patched" \
            --image "$image"
          mv "$root/apps/.github/scripts/ci.py.patched" "$root/apps/.github/scripts/ci.py"
          patched_ci_sha="$(sha256sum "$root/apps/.github/scripts/ci.py" | awk '{print $1}')"
          test "$original_ci_sha" != "$patched_ci_sha"
          ! grep -q 'ghcr.io/truenas/apps_validation:latest' "$root/apps/.github/scripts/ci.py"

          python_version="$(python3 --version 2>&1)"
          pyyaml_version="$(python3 -c 'import yaml; print(yaml.__version__)')"
          (
            cd "$root/apps"
            python3 .github/scripts/ci.py \
              --train community \
              --app element-web \
              --test-file basic-values.yaml
          )

          receipt="$RUNNER_TEMP/truenas-catalog-render-install-v2-receipt.json"
          python3 - "$apps_ref" "$validator_ref" "$base_digest" "$image_id" "$original_ci_sha" "$patched_ci_sha" "$python_version" "$pyyaml_version" "$receipt" <<'PY'
          import json, pathlib, sys
          payload = {
              "schema": "truenas-foundry-catalog-render-install-receipt/v2",
              "classification": "SUPPORTED",
              "oracleSatisfied": True,
              "phase": "native-render-install",
              "apps_ref": sys.argv[1],
              "apps_validation_ref": sys.argv[2],
              "resolved_middleware_base": sys.argv[3],
              "built_validator_image_id": sys.argv[4],
              "upstream_ci_sha256": "sha256:" + sys.argv[5],
              "patched_ci_sha256": "sha256:" + sys.argv[6],
              "python_version": sys.argv[7],
              "pyyaml_version": sys.argv[8],
              "control": {
                  "train": "community",
                  "app": "element-web",
                  "test_file": "basic-values.yaml",
              },
              "preserved_upstream_semantics": [
                  "template rendering",
                  "compose validation",
                  "container start",
                  "health assessment",
                  "failure diagnostics",
                  "cleanup",
              ],
              "modified_seam": "validator image constant + pull routine only",
              "non_claims": [
                  "no Foundry bootstrap candidate admitted",
                  "no exact target TrueNAS runtime qualification",
                  "no catalog-ready claim until a Foundry candidate passes V1+V2",
              ],
          }
          text = json.dumps(payload, indent=2, sort_keys=True) + "\n"
          pathlib.Path(sys.argv[9]).write_text(text, encoding="utf-8")
          print(text, end="")
          PY

      - name: Upload V2 render-install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: truenas-catalog-render-install-v2
          path: ${{ runner.temp }}/truenas-catalog-render-install-v2-receipt.json
          if-no-files-found: warn
          retention-days: 7
