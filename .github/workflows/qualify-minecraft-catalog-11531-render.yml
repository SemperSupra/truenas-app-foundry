name: Qualify exact native Minecraft 1.15.31 canonical render parity
on:
  pull_request:
    paths:
      - '.foundry/controls/minecraft-vanilla-263-11531-upstream.json'
      - 'tools/validate_minecraft_world_control.py'
      - 'tools/qualify_minecraft_catalog_11531_render.py'
      - 'tests/test_minecraft_catalog_11531_render.py'
      - '.github/workflows/qualify-minecraft-catalog-11531-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pinned-upstream-source-render:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact public candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Falsify source, digest, tenant and security drift before vendor fetch
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_minecraft_world_control.py tools/qualify_minecraft_catalog_11531_render.py
          python3 -m unittest discover -s tests -p 'test_minecraft_catalog_11531_render.py' -v
          python3 -m unittest discover -s tests -p 'test_vanilla_263_native_source.py' -v
      - name: Render both vendor revisions with real ix-dev and Docker Compose
        run: |
          set -euo pipefail
          docker compose version
          python3 tools/qualify_minecraft_catalog_11531_render.py > "$RUNNER_TEMP/catalog-11531-render.json"
          python3 - "$RUNNER_TEMP/catalog-11531-render.json" <<'PY'
          import json,sys,re
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["schema"]=="supracraft.minecraft-vanilla263-native-11531-render-parity/1"
          assert r["classification"]=="SOURCE_RENDER_CANONICAL_COMPOSE_IDENTICAL"
          assert re.fullmatch("[a-f0-9]{64}",r["canonical_render_sha256"])
          assert r["same_java25_image_digest"] and r["same_native_world_mount"]
          assert r["same_six_ownership_markers"]
          assert r["same_platform_resolution_and_actions"]
          assert r["runtime_guest_qualified"] is False
          assert r["signed_foundry_consumer_updated"] is False
          assert r["physical_truenas_apply"]=="HOLD"
          PY
      - name: Retain only canonical digest and source qualifications
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minecraft-vanilla-11531-actual-render-parity
          path: ${{ runner.temp }}/catalog-11531-render.json
          if-no-files-found: warn
          retention-days: 7
      - name: Mark source-only, not native guest
        if: always()
        run: echo 'Actual pinned ix-dev source render+Docker Compose comparison only. No signed new Foundry export, no native App, no world mutation, no physical TrueNAS APPLY.' >> "$GITHUB_STEP_SUMMARY"
