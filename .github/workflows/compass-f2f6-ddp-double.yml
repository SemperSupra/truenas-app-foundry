name: Model Compass native F2-F6 deterministic middleware state-machine double
on:
  pull_request:
    paths:
      - 'tests/consumers/model_compass/test_native_f2f6_ddp_double.py'
      - '.github/workflows/compass-f2f6-ddp-double.yml'
permissions:
  contents: read
concurrency:
  group: compass-f2f6-double-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ddp-double:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Red-team generic Foundry native app lifecycle source in an offline double
        shell: bash
        run: |
          set -euo pipefail
          for rep in 1 2 3;do
            python3 -m unittest discover -s tests/consumers/model_compass -p 'test_native_f2f6_ddp_double.py' -v
          done
