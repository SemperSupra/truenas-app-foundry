name: Qualify Document Gateway App

on:
  pull_request:
    paths:
      - 'candidates/document-gateway-app/**'
      - 'tools/validate_document_gateway_app.py'
      - '.github/workflows/qualify-document-gateway-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-document-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Source render, UX contract, and live document-flow smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Foundry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify free-tier runner substrate
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          python3 --version
          git --version

      - name: Install validator dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Qualify Document Gateway candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_document_gateway_app.py \
            --evidence document-gateway-evidence.json

      - name: Publish public-safe qualification summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Document Gateway qualification'
            if [[ -f document-gateway-evidence.json ]]; then
              echo '~~~json'
              cat document-gateway-evidence.json
              echo '~~~'
            else
              echo 'No PASS evidence file was produced; inspect the failed validation step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: document-gateway-qualification
          path: document-gateway-evidence.json
          if-no-files-found: ignore
