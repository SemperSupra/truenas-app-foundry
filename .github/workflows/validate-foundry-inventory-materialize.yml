name: Validate Foundry inventory materialization

on:
  pull_request:
    paths:
      - "tools/foundry_inventory_materialize.py"
      - "tools/test_foundry_inventory_materialize.py"
      - "docs/foundry-inventory-materialize.md"
      - ".github/workflows/validate-foundry-inventory-materialize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise inventory-to-artifact binding
        run: |
          python3 -m unittest -v tools/test_foundry_inventory_materialize.py
          python3 -m py_compile tools/foundry_inventory_materialize.py
