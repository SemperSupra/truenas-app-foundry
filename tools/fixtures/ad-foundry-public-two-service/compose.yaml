# Public pullable behavioral surrogate. NOT the Agent Dispatch Go product image.
services:
  control:
    image: ${SYNTH_IMAGE:?immutable public digest required}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:18092:8080"]
    volumes:
      - "${SYNTH_CUSTODY:?required}:/custody:ro"
      - "${SYNTH_LEDGER:?required}:/ledger:rw"
    command: ["httpd", "-f", "-p", "8080", "-h", "/custody"]
    restart: "no"
  worker:
    image: ${SYNTH_IMAGE:?immutable public digest required}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "${SYNTH_CUSTODY:?required}:/custody:ro"
      - "${SYNTH_LEDGER:?required}:/ledger:rw"
    command: ["sh", "-ec", "n=$$(cat /ledger/count 2>/dev/null || echo 0); echo $$((n+1)) > /ledger/count; exec sleep 3600"]
    restart: "no"
