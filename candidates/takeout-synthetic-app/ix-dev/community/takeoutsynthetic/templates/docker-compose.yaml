{% set tpl = ix_lib.base.render.Render(values) %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "image") %}
{% set permissions = {"uid": values.consts.runtime_uid, "gid": values.consts.runtime_gid, "mode": "check", "chmod": "0750"} %}
{% do perms.add_or_skip_action("archives", values.storage.archives, permissions) %}
{% do perms.add_or_skip_action("state", values.storage.state, permissions) %}
{% if perms.has_actions() %}
  {% do perms.activate() %}
{% endif %}
{% do worker.set_user(values.consts.runtime_uid, values.consts.runtime_gid) %}
{% do worker.set_init(true) %}
{% do worker.set_read_only(true) %}
{% do worker.set_grace_period(60) %}
{% do worker.healthcheck.disable() %}
{% do worker.add_storage("/archive", values.storage.archives) %}
{% do worker.add_storage("/state", values.storage.state) %}
{% do worker.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 32, "mode": "0700", "uid": values.consts.runtime_uid, "gid": values.consts.runtime_gid}}) %}
{% do worker.environment.add_env("PYTHONDONTWRITEBYTECODE", "1") %}
{% do worker.environment.add_env("TMPDIR", "/tmp") %}
{% if perms.has_actions() %}
  {% do worker.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}
{{ tpl.render() | tojson }}
