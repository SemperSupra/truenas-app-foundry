{# PUBLIC-SYNTHETIC SOURCE RENDER ONLY. The image is intentionally nonpullable. #}
{% set tpl = ix_lib.base.render.Render(values) %}
{% set control = tpl.add_container(values.consts.control_container_name, "image") %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "image") %}

{% set custody_ro = {"type": "host_path", "host_path_config": values.storage.custody.host_path_config, "read_only": true} %}
{% set ledger_rw = {"type": "host_path", "host_path_config": values.storage.ledger.host_path_config, "read_only": false} %}

{% for service in [control, worker] %}
{% do service.set_user(values.consts.runtime_uid, values.consts.runtime_gid) %}
{% do service.set_read_only(true) %}
{% do service.add_storage("/custody", custody_ro) %}
{% do service.add_storage("/ledger", ledger_rw) %}
{% do service.healthcheck.disable() %}
{% endfor %}

{% do control.set_command(["serve"]) %}
{% do control.add_port(values.network.control_port) %}
{% do worker.set_command(["worker"]) %}

{{ tpl.render() | tojson }}
