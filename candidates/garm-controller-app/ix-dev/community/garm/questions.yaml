groups:
  - name: GARM Configuration
    description: Configure the initial persistent GARM controller configuration
  - name: Network Configuration
    description: Configure GARM WebUI/API access
  - name: Storage Configuration
    description: Configure persistent GARM state
  - name: Resources Configuration
    description: Configure controller resource limits

questions:
  - variable: garm
    label: ""
    group: GARM Configuration
    schema:
      type: dict
      attrs:
        - variable: jwt_secret
          label: JWT Secret
          description: |
            Initial GARM JWT signing secret. It is written only when /etc/garm/config.toml does not yet exist.
            Use a high-entropy value; GARM rejects secrets that do not meet its password-strength check.
            TrueNAS private fields mask values in the UI; they are not a zero-residue secret store.
          schema:
            type: string
            required: true
            private: true
            min_length: 32
            valid_chars: '^[A-Za-z0-9_-]+$'
            valid_chars_error: Use at least 32 high-entropy characters containing only letters, numbers, underscore, and hyphen.
        - variable: database_passphrase
          label: Database Encryption Passphrase
          description: |
            Initial GARM database encryption passphrase. GARM requires exactly 32 characters and rejects weak values.
            It is written only when /etc/garm/config.toml does not yet exist. Do not rotate this value through the TrueNAS App form after initialization; changing it invalidates encrypted database content.
          schema:
            type: string
            required: true
            private: true
            min_length: 32
            max_length: 32
            valid_chars: '^[A-Za-z0-9_-]+$'
            valid_chars_error: Use exactly 32 high-entropy characters containing only letters, numbers, underscore, and hyphen.
        - variable: enable_webhook_management
          label: Enable GARM Webhook Management
          description: Enable upstream GARM webhook management for Pool-mode compatibility. Runner Scale Sets do not require inbound workflow-job webhooks.
          schema:
            type: boolean
            default: true
            required: true
        - variable: log_level
          label: Log Level
          schema:
            type: string
            default: info
            required: true
            enum:
              - value: debug
                description: Debug
              - value: info
                description: Info
              - value: warn
                description: Warning
              - value: error
                description: Error

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: certificate_id
          label: GARM HTTPS Certificate
          description: Select the TrueNAS-managed certificate presented by the GARM WebUI/API.
          schema:
            type: int
            required: true
            $ref:
              - definitions/certificate
        - variable: https_port
          label: GARM HTTPS Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  hidden: true
                  required: true
                  enum:
                    - value: published
                      description: Publish on the TrueNAS host
              - variable: port_number
                label: Host Port
                description: Host port for the GARM WebUI and API over HTTPS.
                schema:
                  type: int
                  default: 30880
                  min: 1
                  max: 65535
                  required: true
              - variable: container_port
                label: Container Port
                schema:
                  type: int
                  default: 8080
                  hidden: true
                  required: true
              - variable: host_ips
                label: Host IPs
                description: Optional TrueNAS host IPs on which to publish the port. Empty publishes on all addresses according to the TrueNAS library default.
                schema:
                  type: list
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: config
          label: GARM Persistent State
          description: TrueNAS-managed ixVolume mounted at /etc/garm. Host paths are intentionally not offered by the MVP.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: garm-config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: float
                  default: 2
                  min: 1
                  required: true
              - variable: memory
                label: Memory
                schema:
                  type: int
                  default: 4096
                  min: 512
                  required: true
                  unit: MiB
