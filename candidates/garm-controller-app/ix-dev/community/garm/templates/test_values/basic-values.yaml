resources:
  limits:
    cpus: 2.0
    memory: 4096

garm:
  jwt_secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  database_passphrase: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
  enable_webhook_management: true
  log_level: info

network:
  http_port:
    bind_mode: published
    port_number: 30880
