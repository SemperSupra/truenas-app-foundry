groups:
  - name: Runner Manager
    description: Initial non-secret manager settings; no runners or TrueNAS privileges are provisioned on installation.
  - name: Storage Configuration
    description: Persistent runner manager configuration and registration state.
  - name: Resources Configuration
    description: Manager CPU and memory limits. Worker capacity is governed separately.

questions:
  - variable: runner
    label: ""
    group: Runner Manager
    schema:
      type: dict
      attrs:
        - variable: concurrent
          label: Initial Maximum Concurrent Jobs
          description: Initial config.toml seed value only. Existing runner configuration is never overwritten by an App edit, update, or rollback. Keep at one until separate capacity qualification.
          schema:
            type: int
            default: 1
            min: 1
            max: 1
            required: true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: config
          label: Persistent Runner Configuration
          description: TrueNAS-managed ixVolume at /etc/gitlab-runner. Runner registration and credentials are not configured by this candidate.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: gitlab-runner-config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: float
                  default: 1.0
                  min: 1.0
                  required: true
              - variable: memory
                label: Memory
                schema:
                  type: int
                  default: 1024
                  min: 512
                  required: true
                  unit: MiB
