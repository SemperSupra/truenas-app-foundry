{% set tpl = ix_lib.base.render.Render(values) %}
{% set seed = tpl.add_container(values.consts.seed_container_name, "image") %}
{% set runner = tpl.add_container(values.consts.runner_container_name, "image") %}

{# This is the UNREGISTERED controller-only seed, not an enabled TrueNAS worker backend. #}
{% set initial_config %}
concurrent = {{ values.runner.concurrent }}
check_interval = 0
shutdown_timeout = 30
{% endset %}
{% set seed_script = "set -eu; file=/etc/gitlab-runner/config.toml; if [ -e \"$file\" ]; then if [ ! -s \"$file\" ]; then echo 'existing empty GitLab runner config; refusing to overwrite' >&2; exit 42; fi; exit 0; fi; umask 077; cp /seed/config.toml \"$file\"; test -s \"$file\"; chmod 0600 \"$file\"" %}

{% do seed.set_user(0, 0) %}
{% do seed.set_entrypoint(["/bin/sh"]) %}
{% do seed.set_command(["-ec", seed_script]) %}
{% do seed.setup_as_helper("low", true) %}
{% do seed.add_storage(values.consts.config_path, values.storage.config) %}
{% do seed.configs.add("gitlab-initial-config", initial_config, values.consts.seed_config_path, "0400") %}

{% do runner.set_user(0, 0) %}
{% do runner.add_storage(values.consts.config_path, values.storage.config) %}
{% do runner.depends.add_dependency(values.consts.seed_container_name, "service_completed_successfully") %}
{% do runner.healthcheck.disable() %}
{% do runner.set_grace_period(60) %}

{# Intentionally no Docker socket, host paths, privileged mode, host networking,
   TrueNAS management API token, GitLab registration token or worker registration. #}
{{ tpl.render() | tojson }}
