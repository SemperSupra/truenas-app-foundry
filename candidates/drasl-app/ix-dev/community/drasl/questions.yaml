groups:
  - name: Drasl Configuration
    description: Configure the Drasl identity service
  - name: Network Configuration
    description: Configure Drasl HTTP access
  - name: Storage Configuration
    description: Configure persistent Drasl state
  - name: Resources Configuration
    description: Configure Drasl resource limits

questions:
  - variable: drasl
    label: ""
    group: Drasl Configuration
    schema:
      type: dict
      attrs:
        - variable: domain
          label: Domain
          description: Fully qualified domain name used by this Drasl instance, for example drasl.example.com.
          schema:
            type: string
            default: ""
            required: true
        - variable: base_url
          label: Base URL
          description: Public URL used by clients, normally HTTPS when exposed beyond a private RDT&E network.
          schema:
            type: uri
            default: ""
            required: true
        - variable: instance_name
          label: Instance Name
          schema:
            type: string
            default: Drasl
            required: true
        - variable: application_owner
          label: Application Owner
          schema:
            type: string
            default: Anonymous
            required: true
        - variable: default_admins
          label: Default Administrators
          description: Drasl usernames that are permanent administrators for this instance.
          schema:
            type: list
            default: []
            items:
              - variable: admin
                label: Administrator Username
                schema:
                  type: string
                  required: true
        - variable: player_uuid_generation
          label: Player UUID Generation
          description: Random is the upstream default. Offline derives UUIDs from player names for offline-server compatibility.
          schema:
            type: string
            default: random
            required: true
            enum:
              - value: random
                description: Random UUID
              - value: offline
                description: Offline-compatible UUID
        - variable: sign_public_keys
          label: Sign Public Keys
          description: Enable Drasl player public-key signing. Leave enabled for the standalone Drasl baseline.
          schema:
            type: boolean
            default: true
            required: true
        - variable: allow_password_registration
          label: Allow Username/Password Registration
          schema:
            type: boolean
            default: true
            required: true
        - variable: require_invite
          label: Require Invite for Registration
          description: Keep enabled for the default closed-registration posture.
          schema:
            type: boolean
            default: true
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: http_port
          label: Drasl HTTP Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  hidden: true
                  required: true
                  enum:
                    - value: published
                      description: Publish on the TrueNAS host
              - variable: port_number
                label: Host Port
                description: Host port used to reach Drasl directly or through a reverse proxy.
                schema:
                  type: int
                  default: 30085
                  min: 1
                  max: 65535
                  required: true
              - variable: container_port
                label: Container Port
                schema:
                  type: int
                  default: 25585
                  hidden: true
                  required: true
              - variable: host_ips
                label: Host IPs
                description: Optional TrueNAS host IPs on which to publish the port. Empty uses the TrueNAS library default.
                schema:
                  type: list
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: state
          label: Drasl Persistent State
          description: TrueNAS-managed ixVolume containing the database, generated signing key, skins, and capes.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: drasl-state
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: float
                  default: 1
                  min: 1
                  required: true
              - variable: memory
                label: Memory
                schema:
                  type: int
                  default: 512
                  min: 256
                  required: true
                  unit: MiB
