{% set tpl = ix_lib.base.render.Render(values) %}

{% set drasl = tpl.add_container(values.consts.drasl_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_uid, "gid": values.consts.run_as_gid, "mode": "check"} %}

{% set config_toml %}
Domain = {{ values.drasl.domain | tojson }}
BaseURL = {{ values.drasl.base_url | tojson }}
InstanceName = {{ values.drasl.instance_name | tojson }}
ApplicationOwner = {{ values.drasl.application_owner | tojson }}
ListenAddress = "0.0.0.0:{{ values.consts.internal_http_port }}"
StateDirectory = {{ values.consts.state_path | tojson }}
PlayerUUIDGeneration = {{ values.drasl.player_uuid_generation | tojson }}
SignPublicKeys = {{ "true" if values.drasl.sign_public_keys else "false" }}
PreMigrationBackups = true
DefaultAdmins = [{% for admin in values.drasl.default_admins %}{{ admin | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}]

[RegistrationUsernamePassword.CreateNewPlayer]
Allow = {{ "true" if values.drasl.allow_password_registration else "false" }}
RequireInvite = {{ "true" if values.drasl.require_invite else "false" }}
AllowChoosingUUID = false
{% endset %}

{% do drasl.set_user(values.consts.run_as_uid, values.consts.run_as_gid) %}
{# The exact upstream image is intentionally minimal and has no qualified in-container probe utility. #}
{% do drasl.healthcheck.disable() %}
{% do drasl.configs.add("drasl-config", config_toml, values.consts.config_path, "0444") %}
{% do drasl.add_port(values.network.http_port) %}
{% do drasl.add_storage(values.consts.state_path, values.storage.state) %}
{% do perm_container.add_or_skip_action("state", values.storage.state, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do drasl.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.http_port, {"name": "Drasl Web UI", "scheme": "http"}) %}

{{ tpl.render() | tojson }}
