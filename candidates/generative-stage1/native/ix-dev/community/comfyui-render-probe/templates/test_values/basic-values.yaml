resources:
  limits:
    cpus: 1.0
    memory: 1024
ix_volumes:
  comfyui-render-probe-models: /opt/tests/mnt/comfyui-render-probe/models
  comfyui-render-probe-outputs: /opt/tests/mnt/comfyui-render-probe/outputs
storage:
  models:
    type: ix_volume
    ix_volume_config:
      dataset_name: comfyui-render-probe-models
      acl_enable: false
      auto_permissions: false
      create_host_path: true
  outputs:
    type: ix_volume
    ix_volume_config:
      dataset_name: comfyui-render-probe-outputs
      acl_enable: false
      auto_permissions: false
      create_host_path: true
