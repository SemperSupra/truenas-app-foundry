groups:
  - name: WOW Sidecar Configuration
    description: Configure the GitHub App identity, execution-control repository, and one bounded operator profile.
  - name: Storage Configuration
    description: Configure persistent WOW configuration and runtime state.
  - name: Resources Configuration
    description: Configure worker resource limits.

questions:
  - variable: wow
    label: ""
    group: WOW Sidecar Configuration
    schema:
      type: dict
      attrs:
        - variable: github_app_id
          label: GitHub App ID
          description: Numeric GitHub App ID used for repository-scoped installation tokens.
          schema:
            type: string
            required: true
            valid_chars: '^[0-9]+$'
            valid_chars_error: Enter the numeric GitHub App ID.
        - variable: github_app_private_key
          label: GitHub App Private Key
          description: |
            PEM private key for the GitHub App. The seed helper writes it only on first initialization.
            TrueNAS masks private fields in the UI, but this App does not claim zero-residue secret handling.
          schema:
            type: string
            required: true
            private: true
        - variable: control_repository
          label: Execution-Control Repository
          description: Repository in owner/name form used as WOW durable control authority.
          schema:
            type: string
            required: true
            valid_chars: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
            valid_chars_error: Use owner/name.
        - variable: operator_profile_json
          label: Operator Profile JSON
          description: |
            Complete wow-sidecar.operator-profile.v1 JSON document. The App seeds exactly one profile file
            and never rewrites an initialized profile automatically.
          schema:
            type: string
            required: true
            private: true
        - variable: poll_seconds
          label: Poll Interval
          schema:
            type: int
            default: 15
            min: 5
            max: 3600
            required: true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: config
          label: Configuration Storage
          description: TrueNAS-managed ixVolume for the GitHub App key and operator profile.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: wow-sidecar-config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
        - variable: state
          label: Runtime State Storage
          description: TrueNAS-managed ixVolume for WOW durable local runtime state.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: wow-sidecar-state
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: float
                  default: 1
                  min: 1
                  required: true
              - variable: memory
                label: Memory
                schema:
                  type: int
                  default: 1024
                  min: 256
                  required: true
                  unit: MiB
