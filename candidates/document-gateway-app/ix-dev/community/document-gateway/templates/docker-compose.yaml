{% endif %}
{% do cups.healthcheck.set_test("wget", {"port": 631, "path": "/", "scheme": "http", "spider": true}) %}
{% do cups.healthcheck.set_start_period(45) %}
{% do cups.healthcheck.set_retries(10) %}

{% if values.network.mode == "published_ipp" %}
