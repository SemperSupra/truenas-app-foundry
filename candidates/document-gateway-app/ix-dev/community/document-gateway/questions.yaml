groups:
  - name: Gateway Basics
    description: "The few settings most homes need: administrator login, timezone, and the PDF printer name."
  - name: Physical Printers
    description: Optional Brother or other printers that this gateway should expose through CUPS/IPP.
  - name: Document Intake
    description: Scanner, fax, and document-library settings. All sources are normalized into one output directory.
  - name: Fax Outbox
    description: Queue outbound fax jobs independently from any specific fax transport or device.
  - name: File Naming
    description: Human-readable deterministic output naming and optional metadata sidecars.
  - name: Network & Discovery
    description: Choose safe explicit IPP access or enable LAN discovery when your network supports it.
  - name: Storage
    description: Persistent CUPS state, working spool, and the final document library.
  - name: Resources
    description: CPU and memory limits.

questions:
  - variable: TZ
    label: Timezone
    group: Gateway Basics
    schema:
      type: string
      default: Europe/Berlin
      required: true
      $ref:
        - definitions/timezone

  - variable: gateway
    label: ""
    group: Gateway Basics
    schema:
      type: dict
      attrs:
        - variable: admin_user
          label: CUPS Administrator
          description: Username for the CUPS web interface.
          schema:
            type: string
            default: printadmin
            required: true
            valid_chars: '^[A-Za-z0-9_.-]+$'
        - variable: admin_password
          label: CUPS Administrator Password
          description: Use a strong password. TrueNAS masks this field in the UI, but App values are not a zero-residue secret store.
          schema:
            type: string
            required: true
            private: true
            min_length: 12
        - variable: mdns_hostname
          label: Discovery Hostname
          description: Bonjour/mDNS name used when a discovery-capable network mode is selected.
          schema:
            type: string
            default: document-gateway
            required: true
            valid_chars: '^[A-Za-z0-9-]+$'
        - variable: pdf_queue
          label: Save-to-Folder Printer Name
          description: Queue name clients see for the virtual PDF printer that writes into the document library.
          schema:
            type: string
            default: Save_to_Documents
            required: true
            valid_chars: '^[A-Za-z0-9_.-]+$'
        - variable: pdf_display_name
          label: Save-to-Folder Display Name
          schema:
            type: string
            default: Save to Documents
            required: true

  - variable: printers
    label: Physical Printers
    group: Physical Printers
    schema:
      type: list
      default: []
      items:
        - variable: printer
          label: Printer
          schema:
            type: dict
            attrs:
              - variable: queue_name
                label: Queue Name
                description: Stable machine-safe name, for example Brother_Office.
                schema:
                  type: string
                  required: true
                  valid_chars: '^[A-Za-z0-9_.-]+$'
              - variable: display_name
                label: Friendly Name
                description: Name shown to people in print dialogs.
                schema:
                  type: string
                  required: true
              - variable: device_uri
                label: Printer Address (URI)
                description: Prefer driverless IPP, for example ipp://192.168.1.45/ipp/print or ipps://printer.local/ipp/print.
                schema:
                  type: string
                  required: true
              - variable: driver
                label: Driver Mode
                description: IPP Everywhere is preferred for modern Brother and other network printers.
                schema:
                  type: string
                  default: everywhere
                  required: true
                  enum:
                    - value: everywhere
                      description: IPP Everywhere / driverless (recommended)
                    - value: custom
                      description: Specific installed CUPS model (advanced/legacy)
              - variable: model
                label: Custom CUPS Model
                description: Exact CUPS model identifier. Only used when Driver Mode is Custom.
                schema:
                  type: string
                  default: ""
                  show_if: [["driver", "=", "custom"]]
              - variable: shared
                label: Advertise This Printer
                description: Make this queue available to LAN print clients when discovery is enabled.
                schema:
                  type: boolean
                  default: true
  - variable: usb_enabled
    label: Allow USB Printers
    group: Physical Printers
    description: Pass the USB bus into CUPS. Leave off for normal network-connected Brother printers.
    schema:
      type: boolean
      default: false

  - variable: intake
    label: ""
    group: Document Intake
    schema:
      type: dict
      attrs:
        - variable: scan_enabled
          label: Scanner Inbox
          description: Watch /data/incoming/scan. Configure a Brother MFP or other scanner to drop files there through your normal TrueNAS SMB share.
          schema:
            type: boolean
            default: true
        - variable: fax_mode
          label: FRITZ!Box Fax Intake
          description: Choose how received fax files enter the gateway. The source is never modified when mounted read-only.
          schema:
            type: string
            default: data_folder
            required: true
            enum:
              - value: disabled
                description: Disabled
              - value: data_folder
                description: Use /data/incoming/fax in the main document library
              - value: host_path
                description: Read from an existing TrueNAS path
              - value: cifs
                description: Read directly from a FRITZ!Box SMB/CIFS share
        - variable: fax_host_path
          label: Fax Host Path
          schema:
            type: dict
            show_if: [["fax_mode", "=", "host_path"]]
            attrs:
              - variable: acl_enable
                label: Enable ACL
                schema:
                  type: boolean
                  default: false
              - variable: acl
                label: ACL Configuration
                schema:
                  type: dict
                  show_if: [["acl_enable", "=", true]]
                  attrs: []
                  $ref:
                    - normalize/acl
              - variable: path
                label: Path
                description: Existing TrueNAS path containing received fax files.
                schema:
                  type: hostpath
                  show_if: [["acl_enable", "=", false]]
                  required: true
        - variable: fax_cifs
          label: FRITZ!Box SMB Configuration
          description: Credentials are mounted read-only for fax intake. Prefer a dedicated read-only FRITZ!Box user if the device supports it.
          schema:
            type: dict
            show_if: [["fax_mode", "=", "cifs"]]
            attrs:
              - variable: server
                label: FRITZ!Box Host
                description: Hostname or IP address, for example fritz.box.
                schema:
                  type: string
                  required: true
              - variable: path
                label: SMB Share / Path
                description: Share/path that contains received fax files. Enter the path exposed by your FRITZ!Box; do not include smb://.
                schema:
                  type: string
                  required: true
              - variable: username
                label: SMB Username
                schema:
                  type: string
                  required: true
              - variable: password
                label: SMB Password
                schema:
                  type: string
                  required: true
                  private: true
              - variable: domain
                label: SMB Domain
                description: Usually blank for a home FRITZ!Box.
                schema:
                  type: string
                  default: ""

  - variable: fax_outbox
    label: ""
    group: Fax Outbox
    schema:
      type: dict
      attrs:
        - variable: enabled
          label: Enable Fax Outbox
          description: Create and monitor durable outbound fax jobs under /data/outgoing/fax. This does not transmit a fax.
          schema:
            type: boolean
            default: true
        - variable: sender
          label: Fax Sender Plugin
          description: Sender plugins consume the backend-neutral fax job contract. Only the Null sender is implemented in this candidate.
          schema:
            type: string
            default: "null"
            required: true
            enum:
              - value: "null"
                description: Null sender - validate and observe jobs but leave them pending for a future real sender

  - variable: naming
    label: ""
    group: File Naming
    schema:
      type: dict
      attrs:
        - variable: style
          label: Filename Style
          schema:
            type: string
            default: readable
            required: true
            enum:
              - value: readable
                description: 2026-09-27_11-42-03__scan__original-name.pdf
              - value: compact
                description: 20260927T114203__scan__original-name.pdf
        - variable: preserve_original_name
          label: Keep Original Name
          description: Include a cleaned form of the incoming filename after the source label.
          schema:
            type: boolean
            default: true
        - variable: sidecars
          label: Per-Document Metadata Sidecars
          description: Also write a JSON sidecar containing source, original name, size, checksum, and output name. A hidden JSONL event journal is always maintained for automation and agents.
          schema:
            type: boolean
            default: false
        - variable: stable_seconds
          label: File Stability Delay
          description: Seconds a file must remain unchanged before it is imported, preventing partially uploaded scans/faxes from being processed.
          schema:
            type: int
            default: 3
            min: 1
            max: 60
            required: true

  - variable: network
    label: ""
    group: Network & Discovery
    schema:
      type: dict
      attrs:
        - variable: mode
          label: Connection Mode
          description: Published IPP is the safest default. Dedicated LAN identity is best for Bonjour/AirPrint but requires a pre-created external Docker/macvlan network. Host mDNS is a compatibility fallback and can conflict with TrueNAS Bonjour.
          schema:
            type: string
            default: published_ipp
            required: true
            enum:
              - value: published_ipp
                description: Published IPP on the TrueNAS address (safe default; add printer by address)
              - value: external_lan
                description: Dedicated LAN identity (best for AirPrint/Mopria discovery)
              - value: host_mdns
                description: Host network mDNS (compatibility fallback)
        - variable: ipp_port
          label: IPP / CUPS Port
          schema:
            type: dict
            show_if: [["mode", "=", "published_ipp"]]
            attrs:
              - variable: bind_mode
                label: Bind Mode
                schema:
                  type: string
                  default: published
                  hidden: true
                  required: true
                  enum:
                    - value: published
                      description: Published
              - variable: port_number
                label: Host Port
                schema:
                  type: int
                  default: 30631
                  min: 1
                  max: 65535
                  required: true
              - variable: container_port
                label: Container Port
                schema:
                  type: int
                  default: 631
                  hidden: true
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: external_network
          label: Dedicated LAN Network
          schema:
            type: dict
            show_if: [["mode", "=", "external_lan"]]
            attrs:
              - variable: name
                label: Existing Docker Network Name
                description: Pre-created external Docker/macvlan network that reaches your LAN.
                schema:
                  type: string
                  required: true
              - variable: ipv4_address
                label: Static IPv4 Address
                description: Address reserved for the document gateway on that network.
                schema:
                  type: string
                  required: true

  - variable: storage
    label: ""
    group: Storage
    schema:
      type: dict
      attrs:
        - variable: config
          label: CUPS Configuration
          description: TrueNAS-managed persistent state for queues, credentials, PPDs, and CUPS TLS material.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: document-gateway-config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
        - variable: spool
          label: Gateway Working State
          description: Internal spool and normalization ledger.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  hidden: true
                  enum:
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: document-gateway-spool
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
        - variable: documents
          label: Document Library
          description: Final output plus scanner/fax inboxes. Use Host Path when you want this directory exposed by an existing TrueNAS SMB share.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  enum:
                    - value: ix_volume
                      description: Managed ixVolume (easy setup)
                    - value: host_path
                      description: Existing TrueNAS dataset/path (best for normal file sharing)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: document-gateway-documents
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: resources
    label: ""
    group: Resources
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: float
                  default: 2
                  min: 1
                  required: true
              - variable: memory
                label: Memory
                schema:
                  type: int
                  default: 2048
                  min: 512
                  required: true
                  unit: MiB
